services:
  supermemory:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6767:6767"
    volumes:
      - supermemory-data:/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=6767
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - supermemory
    restart: unless-stopped

volumes:
  supermemory-data:
services:
  supermemory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supermemory
    ports:
      - "${SUPERMEMORY_PORT:-6767}:6767"
    volumes:
      - supermemory-data:/data
    environment:
      - PORT=6767
      - SUPERMEMORY_DATA_DIR=/data
      # --- LLM provider: set at least one key -----------------------------
      # Hosted providers:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Any OpenAI-compatible endpoint (Ollama, vLLM, LM Studio, local proxy):
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # --- Embeddings: default is local CPU, no key needed ----------------
      - SUPERMEMORY_EMBEDDING_PROVIDER=${SUPERMEMORY_EMBEDDING_PROVIDER:-local}
      - SUPERMEMORY_EMBEDDING_MODEL=${SUPERMEMORY_EMBEDDING_MODEL:-Xenova/bge-base-en-v1.5}
      - SUPERMEMORY_EMBEDDING_DIMENSIONS=${SUPERMEMORY_EMBEDDING_DIMENSIONS:-768}
    restart: unless-stopped

volumes:
  supermemory-data:
resolver 127.0.0.11 valid=30s;

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA shell for hash router; /api/* goes to the supermemory server.
    # Resolve the upstream at request time so nginx survives compose's boot race.
    location /api/ {
        set $upstream supermemory;
        proxy_pass http://$upstream:6767/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}